add_newline = true
command_timeout = 200
format = "$hostname${custom.worktree}[$directory$git_branch$git_status]($style)\n$character"

# Badge shown only inside a linked git worktree, so a treehouse shell is never
# mistaken for the main checkout. Treehouse pool trees are detached HEAD, so
# git_branch alone gives no hint. TREEHOUSE_DIR is set by `treehouse get`/`enter`.
# Label: "#<slot>" for a pool tree (matches `treehouse status`), else the worktree name.
[custom.worktree]
description = "Identify the current git worktree"
shell = ["bash", "--noprofile", "--norc"]
when = '''[ -n "$TREEHOUSE_DIR" ] || case "$(git rev-parse --git-dir 2>/dev/null)" in */worktrees/*) true;; *) false;; esac'''
command = '''top=${TREEHOUSE_DIR:-$(git rev-parse --show-toplevel)}; case $top in */.treehouse/*) echo "#$(basename "$(dirname "$top")")";; *) basename "$(git rev-parse --git-dir)";; esac'''
format = "[🌳 $output]($style) "
style = "bold #5AF78E"

[hostname]
ssh_only = true
ssh_symbol = "SSH "
format = "[ $ssh_symbol$hostname ]($style) "
style = "bold #282A36 bg:#FF5C57"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold #A5D6A7)[❯](bold #FFF59D)[❯](bold #FFAB91)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "bold"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "bold red"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?"
stashed = "s"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
